name: Public GPS Map - Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gps-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public site has a manifest and every dated file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data')
          manifest = json.loads((root / 'dates.json').read_text(encoding='utf-8'))
          dates = manifest['dates']
          if not isinstance(dates, list) or not dates:
              raise SystemExit('Missing published GPS dates')
          for day in dates:
              route = json.loads((root / f'{day}.json').read_text(encoding='utf-8'))
              assert route['alias'] == 'Supervisor X'
              assert route['date'] == day
              assert route['timeZone'] == 'America/Sao_Paulo'
              assert len(route['positions']) >= 2
          print(f'Validated {len(dates)} published days.')
          PY
      - name: Verify public supervisor label does not regress
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<div class="title" id="route-title">Supervisor</div>' in html
          assert "isViewer?'Supervisor':" in html
          assert "document.title=" in html and "isViewer?'Supervisor':current.alias" in html
          assert 'function layoutReferenceBadgeCenters' in html
          print('Verified Supervisor display label and collision layout.')
          PY
      - name: Verify isolated GPS visitor tracking
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')
          assert "location.hostname === 'virtualsalim.github.io'" in page
          assert "capture_pageleave:true" in page
          assert "capture_pageview:false" in page
          assert "autocapture:false" in page
          assert "disable_session_recording:true" in page
          assert "ph.capture('$pageview',{app:'supervisor_gps_map'})" in page
          assert "gps_map_date_viewed" in page
          assert "gps_date:date" in page
          print('GPS analytics scope and event configuration verified.')
          PY
      - name: Test stop detection rules
        run: node --test scripts/gps-stops.test.mjs
      - name: Generate GPS stop overlays from published daily positions
        run: node scripts/build-gps-stops.mjs data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
